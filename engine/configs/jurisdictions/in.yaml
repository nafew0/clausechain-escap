jurisdiction: IN
source_format: pdf        # India Code / departmental PDFs; gazette PDFs bilingual or Devanagari-only
name: India
un_name: India
languages: { primary: en, supported: [en, hi] }   # English IS authentic for most Union instruments;
                                                  # EXCEPTION: DoT authorisation Rules Jun-Jul 2026 = Devanagari-only
section_grammars: [english, hindi]   # "Section {n}" / "Rule {n}" / "धारा {n}" / "नियम {n}"

whitelist_source: data/official_domains.json
official_sources:
  - { name: India Code, domain: indiacode.nic.in, source_type: official_statute_database, authority_rank: 100 }
  - { name: eGazette, domain: egazette.gov.in, source_type: official_gazette, authority_rank: 100 }   # search UI bot-blocked, but /WriteReadData/<year>/<id>.pdf serves directly (verified 1 Aug); mine ids via gazettetracker.com
  - { name: eGazette (alt), domain: egazette.nic.in, source_type: official_gazette, authority_rank: 100 }
  - { name: MeitY, domain: meity.gov.in, source_type: ministry, authority_rank: 90 }   # ESCAP's most-cited IN domain (31 refs); hosts DPDP Act/Rules/commencement PDFs
  - { name: RBI, domain: rbi.org.in, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: RBI docs, domain: rbidocs.rbi.org.in, source_type: sectoral_regulator, authority_rank: 60 }  # CAPTCHA-guarded at times
  - { name: DoT, domain: dot.gov.in, source_type: ministry, authority_rank: 90 }
  - { name: DoT eservices, domain: eservices.dot.gov.in, source_type: ministry, authority_rank: 90 }
  - { name: CERT-In, domain: cert-in.org.in, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: SEBI, domain: sebi.gov.in, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: IRDAI, domain: irdai.gov.in, source_type: sectoral_regulator, authority_rank: 60 }   # robots-disallowed to bots — archive via manual fetch if needed
  - { name: TRAI, domain: trai.gov.in, source_type: sectoral_regulator, authority_rank: 55 }
  - { name: MCA, domain: mca.gov.in, source_type: ministry, authority_rank: 60 }
  - { name: FIU-India, domain: fiuindia.gov.in, source_type: sectoral_regulator, authority_rank: 50 }
  - { name: DST, domain: dst.gov.in, source_type: ministry, authority_rank: 55 }   # geospatial guidelines
  - { name: IFSCA, domain: ifsca.gov.in, source_type: sectoral_regulator, authority_rank: 50 }
  - { name: PIB, domain: pib.gov.in, source_type: government_press, authority_rank: 40 }
  - { name: THC (rules mirror), domain: thc.nic.in, source_type: official_statute_database, authority_rank: 70 }  # nic.in gov mirror used when MCA/eGazette blocked
  - { name: Pillar 2 procurement source, domain: www.dpiit.gov.in, source_type: official_statute_database, authority_rank: 90 }
  - { name: Pillar 2 procurement source, domain: doe.gov.in, source_type: official_statute_database, authority_rank: 90 }
  - { name: Pillar 2 procurement source, domain: www.dcmsme.gov.in, source_type: official_statute_database, authority_rank: 90 }

portal_search:
  engine: indiacode.nic.in (act/rule search) + departmental portals above
  method: keyword_fulltext
  notes: "eGazette unreachable to bots (TLS/robots) — gazette instruments verified via departmental PDFs (meity/dot/cert-in/sebi/rbi). Several DoT PDFs truncate on fetch; robust download with retries + size check required."

citation_patterns:
  section: ["s. {n}", "Section {n}", "धारा {n}"]
  rule: ["Rule {n}", "rule {n}({m})", "नियम {n}"]
  direction: ["Direction ({roman})", "para {n}"]     # CERT-In directions, RBI circular paras
  paragraph_required: true
connector: generic_seeds
notes:
  - "COMMENCEMENT IS THE INDIA TRAP: DPDP Act 2023 core duties (ss.3-17 incl. s.10 DPO + s.16 transfers) and DPDP Rules rr.5-16 commence 13 MAY 2027 — NOT in force Aug 2026. SPDI Rules 2011 remain operative (repeal deferred). Never cite DPDP substance as current law; record as pipeline."
  - "s.16(1) restricted-country negative list: NEVER NOTIFIED as of cutoff. India's operative P6 weight is sectoral: RBI/SEBI/IRDAI/DoT."
  - "DoT authorisation Rules 2026 (network G.S.R. 644(E); principal 23 Jun 2026; misc 23 Jun 2026) are DEVANAGARI-ONLY gazette PDFs — OCR + [OWN-TRANSLATION] labeling mandatory; an earlier research pass FABRICATED English quotes from these — always quote the Hindi and translate explicitly."
  - "P6 headline: network Rules 2026 r.25(3) = strongest I1 (no proviso in r.25 itself — but 'no offshore route elsewhere in instrument' NOT proven); RBI payment/lending regime = I2 with 24h-repatriation (never I1 — FAQ 5 supplies the transfer path); SEBI cloud framework = I3 (MeitY-empanelled STQC DCs precondition); Companies Accounts Rules r.3(5) proviso = purest I2 (daily backup on India servers)."
  - "P7-I5 rich vein: IT Interception Rules 2009 r.3 (Home Secretary = NON-judicial); Telecom Interception Rules 2024; BNSS 2023 s.94(1) police own-authority vs s.96(1) court-gated vs s.185 initially-warrantless; PMLA s.50(2) summons; Aadhaar s.33(1) court vs s.33(2) Secretary."
  - "P6-I5: India has NO binding data-transfer agreement (UAE CEPA = endeavour + DS carve-out; UK CETA = forward-review only; TEPA/ECTA = no digital chapter; not in RCEP/CPTPP/DEPA/JSI/108). Score-1 supportable."
open_verification:   # deep-research §5/§7 ranked items — UNVERIFIED, do not cite as fact
  - "Income-tax Rules 2026 r.46(8) daily-backup-in-India claim — CONTRADICTORY secondary sources; most consequential open item"
  - "IRDAI 2025 Regulations reg.9(iii) + repeal of 2015 Regs — official text unreadable (robots); rests on exposure draft + secondary"
  - "Unified Licence cl. 39.20/39.23 remote-access clauses — never verified; UL being displaced by 2023-Act regime anyway"
# RESOLVED 1 Aug (full official eGazette texts acquired via egazette.gov.in/WriteReadData —
# the file server is open even where the search portal is bot-blocked; gazette IDs mined
# via gazettetracker.com):
#   - Principal Rules 2026 = G.S.R. 513(E), Gazette CG-DL-E-24062026-273774, 133pp:
#     localisation clause CONFIRMED at r.30(3)(b) [OFFICIAL-EN in gazette English section];
#     the cloud-hosted/satellite carve-out in r.30(3)(a) touches SYSTEM location only —
#     the data-export prohibition in (b) applies to all authorised entities.
#   - Misc Rules 2026 = G.S.R. 512(E), CG-DL-E-23062026-273770, 73pp: r.24(2)(b) negation
#     intact in official English ("no copies ... shall be routed, shared or made available
#     outside India") — the reported drafting defect was a Devanagari-extraction artifact.
#   - Captive Rules 2026 = CG-DL-E-23062026-273771, 52pp: parallel clause at r.24(4).
#   - Migration Rules 2026 = CG-DL-E-23062026-273763, 8pp: archived.
#   - All four gazettes carry an OFFICIAL ENGLISH section — the Devanagari-only concern
#     applies to the dot.gov.in Network-Rules upload, not to the eGazette copies.
# OCR routing (hybrid decision, 1 Aug): gazette pages are Hindi+English bilingual —
# vision-first for scanned docs; most English sources are native-text (no OCR at all).
ocr: { provider: hybrid_script, route: vision-first, language_hints: [hi, en], expect_script: devanagari }
known_index: data/known_index_round2.json
seeds: data/seeds_r2.json
rdtii_bindings: { pillars: [2, 6, 7] }

anchor_instruments:
  - "Information Technology Act 2000 — operative horizontal IT law; ss.69/69A/69B access powers; s.70B CERT-In"
  - "Digital Personal Data Protection Act 2023 — enacted, PHASED: Board machinery live 13 Nov 2025; core duties 13 May 2027 (commencement G.S.R. 843(E))"
  - "CERT-In Directions 28 Apr 2022 — the single densest instrument: P7-I2 (six-hour reporting), P7-I3 (180-day logs; 5-year subscriber/VASP records), P7-I5 (regulator access)"

hunt_instruments:
  P6-I1:
    - "Telecom (Authorisation for Telecommunication Network) Rules 2026 G.S.R. 644(E) — r.25(3) storage-in-India + no-copies-abroad (Devanagari-only)"
    - "Principal Telecom Services Rules 2026 (23 Jun 2026) — parallel clause, pinpoint OPEN"
    - "Misc Telecom Services Rules 2026 — r.24(2)(kha) (M2M/IoT reach; negation defect unresolved)"
    - "DST Geospatial Guidelines 2021 — cl. vii/ix finer-than-threshold data India-only (I1+I3)"
  P6-I2:
    - "RBI payment-data FAQs 26 Jun 2019 — FAQ 4/5: domestic storage + 24h offshore-processing repatriation (I2+I4, defeats I1 reading)"
    - "RBI Digital Lending Directions 2025 para 13(iv) — servers only in India + 24h deletion"
    - "RBI Payment Aggregators Directions 2025 para 9(c) — imports 2018 regime"
    - "NBFC Outsourcing Directions 2017 para 7.3(v) — original records stay in India"
    - "Companies (Accounts) Rules 2014 as amended 2022 — r.3(1) accessible-at-all-times + r.3(5) daily backup on India servers (broadest-scope I2)"
    - "SEBI CSCRF 2024 — Regulatory Data within legal boundaries of India + readable domestic copy"
    - "IRDAI Maintenance of Information Regulations 2025 — reg.9(iii) policies/claims in India DCs (repeals 2015 Regs; verify officially)"
  P6-I3:
    - "SEBI Cloud Framework 2023 — Principle 2: MeitY-empanelled STQC-audited Indian DCs as precondition of serving REs"
  P6-I4:
    - "Network Rules 2026 r.34 — prior CG permission for remote access from abroad (mirror-copy + 6-month audit trail conditions)"
  P7-I3:
    - "CERT-In Directions (iv)/(v)/(vi) — 180-day logs; 5-year subscriber records (VPN/VPS/cloud); 5-year VASP KYC"
    - "PMLA 2002 ss.12(3)-(4) — 5-year records"
    - "Companies Act 2013 s.128(5) — 8-year books"
  P7-I5:
    - "IT (Interception) Rules 2009 rr.3/9/22 — executive (Home Secretary) authorization, score 1"
    - "Telecom (Lawful Interception) Rules 2024 rr.2(1)(c)/3 — executive authorization"
    - "BNSS 2023 — s.94(1) police own-authority (1) vs s.96(1) court warrant (0) vs s.185(1)/(5) initially-warrantless (1)"
    - "Aadhaar Act 2016 — s.33(1) court-gated (0) vs s.33(2) Secretary direction (1)"
    - "PMLA s.50(2) — summons/production own-authority"
  P7-I2:
    - "Telecom (Telecom Cyber Security) Rules 2024 G.S.R. 707(E) — dedicated but SECTORAL (0.5); note: NO localisation in these rules"

