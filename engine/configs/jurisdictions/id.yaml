jurisdiction: ID
source_format: pdf        # JDIH/BPK PDFs; Bahasa Indonesia = Latin script (no OCR-script barrier; easiest R2 economy)
name: Indonesia
un_name: Indonesia
languages: { primary: id, supported: [id, en] }
section_grammars: [indonesian]   # "Pasal {n}" / "Pasal {n} ayat ({m})" — needs pdf_act extra_section_patterns

whitelist_source: data/official_domains.json
official_sources:
