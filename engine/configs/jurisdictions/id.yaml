  - { name: Kominfo JDIH (legacy domain), domain: jdih.kominfo.go.id, source_type: ministry, authority_rank: 85 }
  - { name: OJK, domain: ojk.go.id, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: Bank Indonesia, domain: bi.go.id, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: BSSN, domain: bssn.go.id, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: MoF JDIH, domain: jdih.kemenkeu.go.id, source_type: ministry, authority_rank: 85 }
  - { name: MoH JDIH, domain: jdih.kemkes.go.id, source_type: ministry, authority_rank: 85 }
