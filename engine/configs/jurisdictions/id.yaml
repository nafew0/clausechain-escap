  # canonical mirror (BPK = Supreme Audit Board legal database), alongside the formal peraturan.go.id.
  - { name: BPK legal database, domain: peraturan.bpk.go.id, source_type: official_statute_database, authority_rank: 100 }
  - { name: National legal DB, domain: peraturan.go.id, source_type: official_statute_database, authority_rank: 100 }
  - { name: JDIHN network hub, domain: jdihn.go.id, source_type: official_statute_database, authority_rank: 95 }
