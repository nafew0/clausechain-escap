portal_search:
  engine: peraturan.bpk.go.id search + jdih.komdigi.go.id + regulator sites above
  method: keyword_fulltext
  notes: "BPK DOES index POJK too (verified 1 Aug: POJK 8/2023, 75/2016, 6/2022, 27/2024 all on peraturan.bpk.go.id Details pages with /Download PDFs) — use BPK when ojk.go.id geo-blocks. PBI still needs bi.go.id. Several JDIH download endpoints intermittently 403; retry with browser headers."

citation_patterns:
  section: ["Article {n}", "Art. {n}", "Pasal {n}"]
  paragraph: ["Article {n}({m})", "Pasal {n} ayat ({m})"]
  paragraph_required: true
connector: generic_seeds
notes:
  - "Ministry renamed: Kominfo -> Komdigi (Nov 2024). Permenkominfo instruments keep original titles; both JDIH domains live. 2025 Komdigi rewrite (Permen 5/2025) touched PUBLIC scope only — Permenkominfo 5/2020 remains the private-scope instrument."
  - "P6 shape: NO ban (every domestic-processing mandate has a regulator-approval escape -> 6.4, deep-research negative finding 1); the localisation weight sits in SECTORAL OJK/BI instruments (6.3 DC/DRC preconditions) + KUP tax law 10-year in-Indonesia retention (6.2). PP 71/2019 Art. 21 is PERMISSIVE for private ESOs — an assessor reading only PP 71 will wrongly score 0."
  - "PDP implementing PP: NOT ENACTED (BPK filtered search = 0 results, DB current to PP 30/2025); Badan PDP Perpres still in drafting (Komdigi to Constitutional Court, 27 Jul 2026). UU 27/2022 Arts. 55-56 transfer conditions remain unelaborated — no adequacy list, no SCC template."
  - "KUHAP REPLACED: Law No. 20 of 2025 (effective 2 Jan 2026) repealed Law 8/1981. Old Arts. 33-38 citations are STALE — use Pasal 112 (urgent warrantless search, score 1) vs Pasal 113(1) (court-gated rule)."
  - "PP 46/2014 (Health Information System) shows 'Tidak Berlaku' (revoked, superseded by PP 28/2024) — the Round-2 gold KNOWN row citing PP 46/2014 Art. 21 needs a status flag; Permenkes 24/2022 is the operative medical-records instrument."
  - "Easy false positive: PP 80/2019 Art. 25 retention has NO territorial element (not 6.2); KUP Pasal 28(11) DOES ('di Indonesia')."
  - "P6-I5: IA-CEPA Art. 13.11.2 is the cleanest hard-binding commitment in the whole R2 dossier ('shall allow', no DS carve-out, in force 5 Jul 2020) — decisive score-0 evidence."
open_verification:   # deep-research §5 — UNVERIFIED items
  - "UU 17/2023 health-data cross-border article (potential tier-1 6.4) — text truncates at Pasal 110; follow-up lead: Permenkes 18/2022"
  - "POJK 36/2024 existence + effect on POJK 69/2016 Pasal 49/49A (second pass could not confirm it exists)"
  - "POJK 34/2025 successor provision content (revokes POJK 75/2016 from 18 Dec 2026 — after assessment date; PDF 403)"
  - "BSSN Regs 1/2024 + 2/2024 article pinpoints (BPK metadata verified; PDFs unextractable)"
  - "Indonesia-Korea CEPA / Indonesia-Japan EPA / Indonesia-UAE CEPA digital chapters — NOT INSPECTED (potential extra 6.5 evidence)"
  - "US-Indonesia Agreement on Reciprocal Trade: signed Feb 2026, entry into force NOT verified (Art. 7.5 notification exchange unevidenced)"
# OCR routing (hybrid decision, 1 Aug): Bahasa is Latin script — free self-hosted
# Paddle first, Vision only on low-confidence/empty escalation (recorded in metadata).
ocr: { provider: hybrid_script, route: paddle-first, language_hints: [id], conf_floor: 0.85 }
known_index: data/known_index_round2.json
seeds: data/seeds_r2.json
rdtii_bindings: { pillars: [2, 6, 7] }

anchor_instruments:
  - "Law No. 27 of 2022 on Personal Data Protection — horizontal PDP law fully applicable since 17 Oct 2024 (P7-I1 score-0 evidence); Arts. 55-56 transfer conditions (P6-I4); Art. 53-54 trigger-based DPO (P7-I4 0.5)"
  - "PP 71/2019 (PSTE) — Art. 20 public-scope localisation [GOV-ONLY]; Art. 21 PERMISSIVE for private ESOs + Art. 21(4) delegation to OJK/BI (where the real localisation lives)"
  - "Permenkominfo 5/2020 as amended 10/2021 — private-scope ESO regime: Art. 21/26 supervision access, Art. 36 law-enforcement access (P7-I5 split: (1)-(2) warrantless vs (3)-(5) court-gated)"

hunt_instruments:
  P6-I2:
    - "KUP Law (UU 6/1983 as amended UU 28/2007) Pasal 28(11) — 10-year books retention 'di Indonesia' (textbook 6.2; survived Cipta Kerja + HPP)"
  P6-I3:
    - "POJK 3/2024 (ITSK) Pasal 34 — DC+DRC in Indonesia as licence precondition, NO waiver (strongest ID infra finding)"
    - "POJK 4/POJK.05/2021 Pasal 23(1) — NBFI electronic systems on Indonesian DC/DRC (waiver at 23(3) -> 6.4)"
    - "POJK 69/POJK.05/2016 Pasal 49(3) — insurers DC+DRC in Indonesia (waiver Pasal 49A via POJK 38/2020 -> 6.4)"
    - "POJK 75/POJK.03/2016 Pasal 3(1) + Pasal 16 — rural banks: unqualified domestic DC/DRC + Indonesian-domiciled IT provider (revoked by POJK 34/2025 only from 18 Dec 2026)"
    - "PBI 23/6/PBI/2021 Pasal 48(4) — PJP processing systems on Indonesian DC/DRC (escape at 48(6) -> 6.4)"
    - "PBI 23/7/PBI/2021 Pasal 71(4) — PIP mirror obligation"
    - "Permenkes 24/2022 Pasal 22(1) — EMR outsourcing only to ESOs with in-country storage facilities"
  P6-I4:
    - "POJK 22/2023 Pasal 21(1)-(4) — consumer-data transfer cascade: adequacy -> safeguards -> consent (replaced POJK 6/2022)"
    - "POJK 11/POJK.03/2022 Pasal 36 + Pasal 39(4) — offshore DC/DRC + offshore processing on OJK licence (distinct from skip-listed Pasal 35)"
    - "PBI 23/6 Pasal 48(6)-(8) + PBI 23/7 Pasal 71(6)-(8) — BI-approval offshore processing"
    - "Permen ESDM 7/2019 Pasal 31-32 — oil/gas data abroad on Ministerial licence (clearest non-financial 6.4; contractor-facing, NOT gov-only)"
    - "Permenkominfo 5/2020 Pasal 34 — offshore handling allowed subject to access duty (0.5 — post-hoc condition, not a gate)"
  P7-I3:
    - "AML Law 8/2010 Pasal 21(2) — 5-year customer identification"
    - "KUP Pasal 28(11) — 10 years"
    - "Permenkes 24/2022 Pasal 39(1) — 25-year electronic medical records"
  P7-I5:
    - "Permenkominfo 5/2020 — Pasal 21/26 ministerial supervision access + Pasal 36(1)-(2) traffic/subscriber data on request (warrantless, 1) vs 36(3)-(5) content court-gated (0)"
    - "State Intelligence Law 17/2011 — Pasal 31/32(2)/33 BIN-head written order (1) vs Pasal 32(3) court determination (0)"
    - "AML Law 8/2010 Pasal 41(1)(a) — PPATK own-authority data requests"
    - "KUHAP Law 20/2025 — Pasal 112 urgent warrantless search (1) vs Pasal 113(1) court-gated rule (0)"
    - "KUP Pasal 35A(1) — mandatory tax-data disclosure on administrative demand"
  P7-I2:
    - "Perpres 47/2023 National Cybersecurity Strategy + BSSN Regs 1/2024 (incident mgmt), 2/2024 (crisis mgmt), 5/2024 (action plan) — dedicated national framework, instrument-level not Act-level (score 0 on legal-instrument reading; 0.5 if Act-only reading)"

