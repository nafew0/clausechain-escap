jurisdiction: TL
source_format: pdf        # Jornal da República (JR) PDFs on mj.gov.tl -> extractors/pdf_act.py; native Portuguese text layers
name: Timor-Leste
un_name: Timor-Leste
languages: { primary: pt, supported: [pt, en, tet] }
section_grammars: [portuguese, article]   # "Artigo N.º" (JR) + "Article N" (ATISA English text); "Section N" (UNTAET/Constitution EN) is the default grammar
citation_template: "Art. {label}"

whitelist_source: data/official_domains.json
official_sources:
  # ranks follow the sg/my convention: 100 statute DB / gazette, 90 treaty register, 60 regulator
  - { name: Jornal da República (Ministry of Justice), domain: mj.gov.tl, source_type: official_gazette, authority_rank: 100 }
  - { name: Government of Timor-Leste, domain: timor-leste.gov.tl, source_type: ministry, authority_rank: 70 }
  - { name: National Parliament, domain: parlamento.tl, source_type: official_gazette, authority_rank: 90 }
  - { name: Autoridade Nacional de Comunicações (ANC), domain: anc.tl, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: Banco Central de Timor-Leste, domain: bancocentral.tl, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: Pillar 2 procurement source, domain: docs.wto.org, source_type: official_statute_database, authority_rank: 90 }

portal_search:
  engine: mj.gov.tl/jornal (JR Série I issue PDFs by year) + public/docs/2002_2005 per-diploma PDFs
  method: listing_scan
  notes: >-
    A JR Série I issue bundles several diplomas in one PDF: seeds carry page_range (and a #page=N
    fragment so each instrument keeps its own manifest entry). Approving laws print their own
    "Artigo 1.º" before the annexed code (Mining Code, Insurance Law, CPP): page_range starts at the
    annex. 2002-2005 diplomas are single-diploma PDFs; the DL 13/2005 CPP gazette original is a scan
    (the court's bilingual Tetum/Portuguese edition at /jornal/files/Codigo_Processo_Penal.pdf is not used).

citation_patterns:
  section: ["Art. {n}", "Artigo {n}.º", "s. {n}"]
  paragraph_required: false
connector: generic_seeds
legal_fit_reads_translation: true   # G7 patterns are English; also read the mapper's English account
notes:
  - "NO GOLD: the ESCAP Round-2 database has no Timor-Leste sheet, so every finding is NEW and every score is a first coding."
  - "ABSENCE-HEAVY ECONOMY: no personal-data law, no cybersecurity law, no cybercrime law and no DPO rule is in force (P7-I1, P7-I2, P7-I4 absences). The Constitution s. 38 is the governing instrument cited by absence rows; the draft Personal Data Protection Law and the cybersecurity legislative-authorisation bill are watch items, not evidence."
  - "Polarity (research 28-Sep-2026, status Aug 2026): P6-I1 0, P6-I2 1 (two+ sectoral copy/records rules: UNTAET 2000/8 s. 27.2 banking, Petroleum Law art. 25(2), Mining Code art. 55(1)(c) — insurance art. 26 weaker), P6-I3 0 (DL 12/2024 art. 8(2)(b) makes server location irrelevant), P6-I4 0, P6-I5 0 (ATISA FS Annex Art. 9(1)(a) — PANEL DECISION: alternative 1 if only horizontal/e-commerce commitments count)."
  - "Lei n.º 10/2026 (financial system, JR 12-Aug-2026) enters into force one year after publication and then revokes UNTAET 2000/8 — seeded as not_yet_effective so it stays a lead, not evidence."
  - "Commercial Companies Law (Lei 10/2017) art. 87(3) corporate books at the registered office: research recommends not scoring — not seeded."
  - "P7: I3 1 (Lei 17/2011 AML art. 15(1)(a) five years; Decreto do Governo 9/2008 art. 6(1) five-year subscriber file), I5 split: CPP art. 56 warrantless urgent searches vs arts. 169, 177 court-gated. The P7 report's I4 row (Census Law 5/2010, 'maximum retention') applies the wrong rubric — P7-I4 is DPO/DPIA — and is not seeded."
  - "[GOV-ONLY] DL 16/2014 FIU cooperation, DL 29/2017 TIC Timor, DL 4/2023 statistics; [OUT-OF-SCOPE-network] DL 17/2025 submarine cable company — recorded by research, not seeded."
  - "page_range must start on the instrument's own first article page: a range that begins on the previous diploma's tail (JR 2008 N.º 14 p.4 = Lei 6/2008 arts. 21-26) makes the monotonic filter reject the real articles. Decreto do Governo 9/2008 = pp. 5-7; its art. 10 unit also carries the trailing Resolução 8/2008 text on p.7."
  - "Older JR issues print ordinals as a letter ('Artigo 10.o'); the portuguese grammar accepts º ° ª o."
  - "Changing a seed URL (e.g. its #page= fragment) leaves the old key in data/raw/tl/seeds_manifest.json; remove it by hand — the builder processes every ok manifest entry."
open_verification:
  - "ATISA: confirm it was among the instruments deposited on 24 Nov 2025 (AEM-58 says 51 ASEAN economic agreements, list unpublished)"
  - "DL 13/2005 CPP: scanned gazette original -> Vision OCR; check art. 56 / 169 / 177 labels after the build (approving decree's own articles precede the code)"
  - "Lei 17/2011 as amended by Lei 5/2013 — the 2013 amendment is not seeded; confirm art. 15 unchanged"
ocr: { provider: hybrid_script, route: vision-first, language_hints: [pt] }
known_index: data/known_index_round2.json
seeds: data/seeds_r2.json
rdtii_bindings: { pillars: [2, 6, 7] }

anchor_instruments:
  - "Constitution (2002) s. 38 — personal-data protection right with 'the law shall determine' (no implementing law yet: P7-I1 absence)"
  - "Decreto-Lei n.º 12/2024 e-commerce and e-signatures — art. 8(2)(b) server location irrelevant to place of business (P6 negative evidence)"
  - "Decreto-Lei n.º 15/2012 telecommunications (amended DL 31/2024) — art. 49 subscriber data consent/security (P6-I2/I3 score 0; sectoral security, not a cyber framework)"

hunt_instruments:
  P6-I2:
    - "UNTAET Regulation 2000/8 s. 27.2 — credit documentation at the head office in East Timor"
    - "Lei 13/2005 art. 25(2) — Ministry may require originals of petroleum data kept in Timor-Leste"
    - "Lei 12/2021 Mining Code art. 55(1)(c), art. 110(1) — originals of mining records in Timor-Leste"
    - "Lei 6/2005 insurance art. 26 — records at the insurer's premises"
  P6-I5:
    - "ATISA Annex on Financial Services Art. 9(1)(a); Annex on Telecommunication Services Art. 3(3)"
  P7-I3:
    - "Lei 17/2011 art. 15(1)(a) — customer identification copies at least five years"
    - "Decreto do Governo 9/2008 art. 6(1) — subscriber file at least five years; art. 7(4) traffic data one year"
    - "ANC SIM registration guidelines §5.1-5.5"
  P7-I5:
    - "CPP (DL 13/2005) art. 56 warrantless urgent searches (score 1) vs art. 169(1) searches authorised by the judge and art. 177(1) interception by judicial decision (score 0)"

# Provisional indicator scores from the P6/P7 deep-research reports (no ESCAP master exists for TL).
research_scores: { P6-I1: 0, P6-I2: 1, P6-I3: 0, P6-I4: 0, P6-I5: 0, P7-I3: 1, P7-I5: 1, P2-I1: 0, P2-I2: 0, P2-I3: 1, P2-I4: 1 }

governing_instruments:
  default: { law: "Constitution of the Democratic Republic of Timor-Leste (2002)", url: "https://timor-leste.gov.tl/wp-content/uploads/2010/03/Constitution_RDTL_ENG.pdf" }
  P6-I1:   { law: "Decreto-Lei n.º 12/2024 Regime Jurídico Geral do Comércio Eletrónico e de Assinaturas Eletrónicas", url: "https://www.mj.gov.tl/jornal/public/docs/2024/serie_1/SERIE_I_NO_7.pdf" }
  P6-I3:   { law: "Decreto-Lei n.º 12/2024 Regime Jurídico Geral do Comércio Eletrónico e de Assinaturas Eletrónicas", url: "https://www.mj.gov.tl/jornal/public/docs/2024/serie_1/SERIE_I_NO_7.pdf" }
  P6-I4:   { law: "Decreto-Lei n.º 12/2024 Regime Jurídico Geral do Comércio Eletrónico e de Assinaturas Eletrónicas", url: "https://www.mj.gov.tl/jornal/public/docs/2024/serie_1/SERIE_I_NO_7.pdf" }
  P7-I2:   { law: "Decreto-Lei n.º 15/2012 Regulamentação do Sector das Telecomunicações", url: "https://www.mj.gov.tl/jornal/public/docs/2012/serie_1/serie1_no12.pdf" }
  # Pillar 2: the procurement law is the reference basis for a procurement absence row (30 Sep 2026).
  P2-I1:   { law: "Decreto-Lei n.º 1/2025 Código do Aprovisionamento e dos Contratos Públicos (Public Procurement and Public Contracts Code)", url: "https://www.mj.gov.tl/jornal/public/docs/2025/serie_1/SERIE_I_NO_2.pdf#page=4" }
  P2-I2:   { law: "Decreto-Lei n.º 1/2025 Código do Aprovisionamento e dos Contratos Públicos (Public Procurement and Public Contracts Code)", url: "https://www.mj.gov.tl/jornal/public/docs/2025/serie_1/SERIE_I_NO_2.pdf#page=4" }
  P2-I3:   { law: "Decreto-Lei n.º 1/2025 Código do Aprovisionamento e dos Contratos Públicos (Public Procurement and Public Contracts Code)", url: "https://www.mj.gov.tl/jornal/public/docs/2025/serie_1/SERIE_I_NO_2.pdf#page=4" }

