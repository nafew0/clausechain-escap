jurisdiction: RU
source_format: pdf        # pravo.gov.ru ИПС consolidated HTML -> Chromium print-to-PDF (seed acquire: html_render) -> extractors/pdf_act.py
name: Russian Federation
un_name: Russian Federation
languages: { primary: ru, supported: [ru, en] }
section_grammars: [russian]   # "Статья N." (inserted articles "Статья 18¹" -> label 18.1)
citation_template: "Art. {label}"

whitelist_source: data/official_domains.json
official_sources:
  # ranks follow the sg/my convention: 100 statute DB / gazette, 90 treaty register, 60 regulator
  - { name: Official legal information portal (ИПС Законодательство России), domain: pravo.gov.ru, source_type: official_statute_database, authority_rank: 100 }
  - { name: Official publication portal, domain: publication.pravo.gov.ru, source_type: official_gazette, authority_rank: 100 }
  - { name: Government of the Russian Federation, domain: government.ru, source_type: ministry, authority_rank: 70 }
  - { name: Government static files, domain: static.government.ru, source_type: ministry, authority_rank: 70 }
  - { name: President of Russia (acts bank), domain: kremlin.ru, source_type: official_gazette, authority_rank: 90 }
  - { name: Roskomnadzor, domain: rkn.gov.ru, source_type: regulator_guidance, authority_rank: 60 }
  - { name: Roskomnadzor personal-data portal, domain: pd.rkn.gov.ru, source_type: regulator_guidance, authority_rank: 60 }
  - { name: Council of Europe treaty office, domain: rm.coe.int, source_type: official_treaty_or_state_register, authority_rank: 90 }
  - { name: Council of Europe, domain: coe.int, source_type: official_treaty_or_state_register, authority_rank: 90 }

portal_search:
  engine: pravo.gov.ru/proxy/ips (ИПС) — list search by number (a8) + date (a7date), cp1251 parameters
  method: number_date_lookup
  notes: >-
    Resolve a law's nd id with ?list_itself=&bpas=cd00000&a8=<№>&a8type=1&a7type=1&a7date=<dd.mm.yyyy>.
    The print view ?docview&page=1&print=1&nd=<nd>&rdk=<revision> carries the WHOLE consolidated text
    (verified: CPC 560 articles, Tax Code Part One 275) and rdk pins the revision. Use http:// —
    https://government.ru and kremlin.ru time out from outside Russia and government.ru 403s after a
    few requests; base.garant.ru / consultant.ru are private databases (never evidence, leads only).

citation_patterns:
  section: ["Art. {n}", "Статья {n}", "ст. {n}"]
  paragraph_required: false
connector: generic_seeds
gold_anchor_roles: [operative, supporting]   # inject the master's supporting refs as candidates too
legal_fit_reads_translation: true   # G7 patterns are English; also read the mapper's English account
notes:
  - "HTML-ONLY ECONOMY: the official consolidated texts exist only as pravo.gov.ru ИПС HTML. seeds_fetch acquire=html_render prints the pinned-revision print view to PDF (raw HTML archived beside it, sha256 in the manifest). Only DOM change: <sup>digits</sup> -> Unicode superscripts so 'Статья 18¹' survives the text layer."
  - "Inserted articles are superscripts (18¹, 22¹, 10.1 of 149-FZ is 'Статья 10¹'); pdf_act normalises the label to 18.1 — matching the ESCAP gold's 'Art. 18.5'/'Art. 22.1' style."
  - "Each part ('1.', '1¹.', '2.') of an article is its own unit — Art. 12(4), Art. 64(1.1) — and a part longer than 8,000 chars splits into its list items (Police Law Art. 13(1)(4)). Whole consolidated articles otherwise exceed the aligner's 6-page window and become unaligned (not citable)."
  - "Polarity (research 22-Aug-2026): P6-I1 0 (Art. 12 preserves a transfer path; 18(5) is localisation not a ban), P6-I2 1 (152-FZ Art. 18(5), reworded 2025 by No. 23-FZ to prohibit foreign databases for the listed operations), P6-I3 0, P6-I4 1 (Art. 12(3) notification + Roskomnadzor restriction regime, Res. 6/24 of 2023), P6-I5 0 (Convention 108 ratified 2013)."
  - "ESCAP gold (R2) scores P6-I1 = 1 on 152-FZ 12.7/18.5 and P6-I3 = 1 on 18.5 — the research reads 18(5) as localisation (P6-I2) not ban/infrastructure. Divergence is for the Zone-3 panel, not the engine."
  - "P7: I1 0 (152-FZ), I2 0 (187-FZ + Doctrine No. 646 + Decree 250; ESCAP gold holds 0.5), I3 1 (126-FZ Art. 64 three-year metadata floor; 149-FZ Art. 10.1; 115-FZ; 402-FZ Art. 29; Tax Code Art. 23), I4 1 (152-FZ Art. 22.1 responsible person), I5 1 (126-FZ Art. 64(1), 149-FZ Art. 10.1(3.1)/(4.1), Police Law Art. 13 — CPC Arts. 29/165/182/186.1 are the court-gated counter-evidence)."
  - "[GOV-ONLY] exclusions: Res. No. 2526 of 2022 (state-function transfers), CII/technological-independence decree No. 166 of 2022 — recorded by research, not seeded."
open_verification:
  - "No. 265-FZ of 26.07.2026 amends 152-FZ Art. 12 — consolidated rdk=38 lists it; confirm the effective date of each amended part before final export"
  - "Roskomnadzor Order No. 180 (2022, notice forms) and No. 187 (2022, incident interaction) and FSTEC Order No. 239 (2017) — publication.pravo.gov.ru originals not seeded yet"
  - "Russia's position on Convention 108 after its 16 Mar 2022 expulsion from the Council of Europe (treaty itself remains open to non-members; confirm no denunciation)"
ocr: { provider: hybrid_script, route: vision-first, language_hints: [ru], expect_script: cyrillic }
known_index: data/known_index_round2.json
seeds: data/seeds_r2.json
rdtii_bindings: { pillars: [2, 6, 7] }

anchor_instruments:
  - "Federal Law No. 152-FZ On Personal Data — Art. 12 cross-border regime (P6-I4), Art. 18(5) localisation (P6-I2), Art. 22.1 responsible person (P7-I4); horizontal framework (P7-I1 score-0 evidence)"
  - "Federal Law No. 187-FZ On Security of CII — dedicated cybersecurity statute (P7-I2 score-0 evidence)"
  - "Federal Law No. 126-FZ On Communications — Art. 64 retention floors and disclosure to authorised bodies (P7-I3, P7-I5)"
  - "Federal Law No. 149-FZ On Information — Art. 10.1 organiser retention/disclosure/decryption keys (P7-I3, P7-I5)"

hunt_instruments:
  P6-I4:
    - "Government Resolution No. 6 of 10.01.2023 — rules for prohibiting/restricting cross-border transfers"
    - "Government Resolution No. 24 of 16.01.2023 (amended by No. 1371 of 2024) — public-interest restriction pathway"
    - "Federal Law No. 572-FZ (2022) — biometric data transfer restriction (sectoral)"
  P7-I3:
    - "Government Resolution No. 445 of 12.04.2018 — six-month content storage by operators"
    - "Federal Law No. 115-FZ Art. 7(4) — five-year AML records floor"
    - "Federal Law No. 402-FZ Art. 29 — five-year accounting records floor"
    - "Tax Code Part One Art. 23(1)(8) — five-year tax records floor"
  P7-I5:
    - "Federal Law No. 3-FZ On Police Art. 13(1)(4) — reasoned request, no court order"
    - "Tax Code Art. 93.1 — tax authority demands"
    - "Federal Law No. 144-FZ On Operational-Search Activity — court-gated vs own-authority measures"
    - "Criminal Procedure Code Arts. 29(2), 165, 182, 186.1 — court-gated counter-evidence"

