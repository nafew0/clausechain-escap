jurisdiction: TH
source_format: pdf        # Royal Gazette / regulator PDFs -> extractors/pdf_act.py; Thai script -> OCR-heavy
name: Thailand
un_name: Thailand
languages: { primary: th, supported: [th, en] }
section_grammars: [thai]  # มาตรา (matra, sections in acts) / ข้อ (kho, clauses in notifications)
                          # NOTE: needs pdf_act extra_section_patterns for "มาตรา {thai-numeral}" — P3.6 hook

whitelist_source: data/official_domains.json
official_sources:
  # ranks follow the sg/my convention: 100 statute DB / gazette, 90 treaty register, 60 regulator
  - { name: Royal Gazette, domain: ratchakitcha.soc.go.th, source_type: official_gazette, authority_rank: 100 }
  - { name: OCS law portal (laws.go.th), domain: laws.go.th, source_type: official_statute_database, authority_rank: 100 }
  - { name: OCS full-text search, domain: searchlaw.ocs.go.th, source_type: official_statute_database, authority_rank: 95 }
  - { name: MDES, domain: mdes.go.th, source_type: ministry, authority_rank: 60 }        # ESCAP's most-cited TH domain (30 refs)
  - { name: PDPC, domain: pdpc.or.th, source_type: regulator_guidance, authority_rank: 60 }
  - { name: NCSA, domain: ncsa.or.th, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: NCSA drive (notifications), domain: drive.ncsa.or.th, source_type: sectoral_regulator, authority_rank: 55 }
  - { name: ETDA, domain: etda.or.th, source_type: sectoral_regulator, authority_rank: 60 }  # hosts consolidated CCA EN text
  - { name: NBTC, domain: nbtc.go.th, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: NBTC broadcast, domain: broadcast.nbtc.go.th, source_type: sectoral_regulator, authority_rank: 50 }
  - { name: Bank of Thailand, domain: bot.or.th, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: BOT FIPCS register, domain: app.bot.or.th, source_type: sectoral_regulator, authority_rank: 60 }
  - { name: OIC (insurance), domain: oic.or.th, source_type: sectoral_regulator, authority_rank: 55 }
  - { name: OIC e-service, domain: oiceservice.oic.or.th, source_type: sectoral_regulator, authority_rank: 55 }
  - { name: DBD (business dept), domain: dbd.go.th, source_type: sectoral_regulator, authority_rank: 50 }
  - { name: Thai Customs, domain: customs.go.th, source_type: sectoral_regulator, authority_rank: 50 }
  - { name: MoPH DDC, domain: ddc.moph.go.th, source_type: sectoral_regulator, authority_rank: 45 }
  - { name: SEC Thailand, domain: sec.or.th, source_type: sectoral_regulator, authority_rank: 55 }
  - { name: DFAT AANZFTA texts, domain: dfat.gov.au, source_type: official_treaty_or_state_register, authority_rank: 90 }
  - { name: MFAT RCEP texts, domain: mfat.govt.nz, source_type: official_treaty_or_state_register, authority_rank: 90 }
  - { name: Pillar 2 procurement source (CGD e-GP), domain: gprocurement.go.th, source_type: official_statute_database, authority_rank: 90 }
  - { name: Department of Intellectual Property, domain: ipthailand.go.th, source_type: ministry, authority_rank: 60 }

portal_search:
  engine: searchlaw.ocs.go.th (OCS full-text) + ratchakitcha.soc.go.th documents + regulator sites above
  method: keyword_fulltext
  notes: "laws.go.th UI is JavaScript-driven (research pass got access errors) — use searchlaw.ocs.go.th and direct Gazette /documents/*.pdf URLs. pdpc.or.th intermittently 403s bots."

citation_patterns:
  section: ["s. {n}", "Section {n}", "มาตรา {n}", "matra {n}"]
  clause: ["clause {n}", "ข้อ {n}", "kho {n}"]     # subordinate notifications cite ข้อ, not มาตรา
  paragraph_required: true
connector: generic_seeds
notes:
  - "OCR-FIRST ECONOMY: Royal Gazette PDFs often embed document-specific SUBSET FONTS — text layer extracts as mojibake (research pass: 'Nล@$>@/...' garbage). Route ratchakitcha PDFs through OCR/VLM even when a text layer exists; sanity-check output contains real Thai script."
  - "Years are Buddhist Era (B.E. = CE + 543); sections use Thai numerals in gazette text — normalise to Arabic in citations, keep native form in Verbatim Snippet."
  - "Verbatim Snippet = Thai; use 'Verbatim Snippet (English)' appended column with [OWN-TRANSLATION]/[OFFICIAL-EN] label. ETDA hosts official-ish EN consolidations for CCA."
  - "PDPC subordinate notification wave 2022-2026 is the NEW-evidence vein: security measures 2022, breach notification 2022, processor ROPA 2022, DPO notifications 2023 + No.2 2025, s.28/s.29 cross-border notifications 2023, BCR certification regulation Feb 2026."
  - "P7-I5 court-order split verified: CCA s.18(4)-(8) powers are COURT-GATED by s.19; DSI Act s.24 own-authority vs s.25 court-gated; AMLA s.38 own-authority vs s.46 court-gated; CPC s.92 warrantless exceptions vs s.57 court rule. Record both, only warrantless drives score 1."
  - "P6 shape: NO ban, NO horizontal storage/infra mandate found (deep-research negative findings 1-3). PDPA s.28/29 + subordinate notifications = conditional flow (6.4). Do not code 6.1."
open_verification:   # from deep-research §5 — treat these as UNVERIFIED until re-checked
  - "Exact ข้อ numbers of the 2023 s.28/s.29 PDPC notifications (inferred, not read)"
  - "2026 BCR regulation exact Thai title (gazette font mojibake); whether any BCR approved in practice"
  - "BOT FPG 8/2557 in-force status (FIPCS status filter is a JS postback form)"
  - "MDES traffic-retention notification B.E. 2564 text (all fetch routes failed; 90-day floor rests on gazette cite)"
  - "SEC (ก.ล.ต.) rules + Cloud-First/GDCC policy — NOT RESEARCHED, not a negative"
# OCR routing (hybrid decision, 1 Aug): Paddle is blind to Thai — pages go straight
# to Vision (no double spend). Language hints from this pack.
ocr: { provider: hybrid_script, route: vision-first, language_hints: [th], expect_script: thai }
known_index: data/known_index_round2.json
seeds: data/seeds_r2.json
rdtii_bindings: { pillars: [2, 6, 7] }

anchor_instruments:
  - "Personal Data Protection Act B.E. 2562 (2019) — horizontal DP law (P7-I1 score-0 evidence); s.28/s.29 = cross-border conditional flow (P6-I4); s.41 DPO (P7-I4)"
  - "Cyber Security Maintenance Act B.E. 2562 (2019) — dedicated horizontal cybersecurity framework (P7-I2 score-0 evidence)"
  - "Computer Crime Act B.E. 2550 as amended B.E. 2560 — s.18 access powers, s.19 court gate, s.26 traffic-data retention (90-day floor via MDES notification B.E. 2564)"

hunt_instruments:
  P7-I3:   # minimum retention floors
    - "MDES Notification on Computer Traffic Data Retention B.E. 2564 — kho 3/12/13, >=90 days (replaced 2007 MICT notification)"
    - "Anti-Money Laundering Act B.E. 2542 — matra 22, 5-year customer ID + transaction records"
    - "Accounting Act B.E. 2543 — matra 14, 5-year accounts floor (matra 13: keep at place of business)"
    - "Labour Protection Act B.E. 2541 — matra 115, 2-year employment records"
    - "Credit Information Business Operation Act B.E. 2545 — s.13 retention"
  P7-I4:
    - "PDPC DPO Notification B.E. 2566 — kho 4-6, 100k-data-subject trigger + deemed-large-scale sectors (0.5, trigger-based)"
    - "PDPC State-Agency DPO Notification B.E. 2566 + No.2 B.E. 2568 (provinces/municipalities added)"
  P7-I5:
    - "Special Case Investigation Act B.E. 2547 — matra 24 own-authority (score 1) vs matra 25 court-gated"
    - "AMLA B.E. 2542 — matra 38(1)-(3) own-authority vs matra 46 court-gated"
    - "Criminal Procedure Code — matra 92 warrantless exceptions vs matra 57 court rule"
    - "National Intelligence Act B.E. 2562 — ss.5-6 (already in gold)"
  P6-I4:
    - "PDPC s.28 notification B.E. 2566 (adequacy criteria; transit/no-access-cloud carve-out)"
    - "PDPC s.29 notification B.E. 2566 (contract clauses incl. ASEAN MCCs/EU SCCs, certification, intergovernmental)"
    - "PDPC BCR Certification Regulation B.E. 2568 (17 Feb 2026, gazette 103274.pdf) — first operational BCR procedure"
    - "OIC insurance data guidelines — kho 9 cross-border cross-reference (0.5, do not double-count)"
    - "BOT FPG 8/2557 outsourcing — clause 5.3.1(2)(2.2) prior approval for overseas providers (in-force status OPEN)"
  P6-I5:   # treaty evidence (absence-scored: rows document what EXISTS)
    - "AANZFTA Second Protocol Ch.10 Arts.17/18 — STRONGEST for TH: mandatory + DS suspended only to 21 Apr 2028; in force for TH 21 Apr 2025"
    - "RCEP Art. 12.15.2/12.14.2 — binding text but Ch.12 wholly DS-excluded (Art. 12.17.3) + self-judging exceptions; in force TH 1 Jan 2022"
    - "ASEAN E-Commerce Agreement Art. 7.4 — NOT hard-binding ('recognise the importance', 'subject to laws') — record, do not rely"

