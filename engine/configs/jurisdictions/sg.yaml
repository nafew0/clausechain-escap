  "Government Procurement (Challenage Proceddings) Regulation 2002": "Government Procurement (Challenge Proceedings) Regulations 2002"
  "Government Procurement Act (GPA) 1997": "Government Procurement Act 1997"
  "Government Procurement Regulations (GP Regulations) 2014": "Government Procurement Regulations 2014"
  "Government Procurement (Application) Order (GP Order) 2002": "Government Procurement (Application) Order 2002"

research_scores: { P2-I1: 0, P2-I2: 0.5, P2-I3: 1, P2-I4: 0.5 }

# Pillar 2 additive builds (scripts/build_seeds_corpus.py --pillars P2) only; the
# dedicated P6/P7 builders do not read this key.
ocr: { provider: google_vision, language_hints: [en] }
